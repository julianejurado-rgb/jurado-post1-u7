# src/main/resources/application.properties
server.port=8080
spring.application.name=gestion-tareas
# DevTools: deshabilitar caché de Thymeleaf en desarrollo
spring.thymeleaf.cache=false
logging.level.com.universidad=DEBUG
# Formato ISO (yyyy-MM-dd) para las fechas: el campo <input type="date"> solo acepta ese formato
spring.mvc.format.date=iso
